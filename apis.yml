aid: rapidai
name: RapidAI
description: 'RapidAI (legal entity iSchemaView, Inc., San Mateo, California) builds
  a deep clinical AI platform for medical imaging, best known for the Rapid product
  family used in stroke and vascular care. Founded in 2012 by Stanford researchers
  Roland Bammer and Gregory Albers, its FDA-cleared modules — Rapid ASPECTS, Rapid
  CTA, Rapid CTP, Rapid LVO, Rapid ICH, Rapid MRI, Rapid PE, Rapid Aortic, Rapid Aneurysm
  and Lumina 3D — analyze non-contrast CT, CT angiography, CT perfusion and MRI studies
  to triage ischemic stroke, hemorrhagic stroke, aneurysm, pulmonary embolism and
  aortic disease. The Rapid Enterprise Platform runs on-premise, in the cloud, or on
  Rapid Edge Cloud, and integrates with hospital PACS, RIS, EHR and radiology worklist
  systems through standard HL7, FHIR and DICOM interfaces plus custom APIs. RapidAI
  runs a Rapid Technology Partner Program with an API that lets technology partners
  integrate Rapid results into their own products; that API is commercial and gated
  — there is no public developer portal, OpenAPI definition, or self-service sign-up.'
