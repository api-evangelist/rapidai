apis:
- aid: rapidai:rapid-platform-api
  name: Rapid Technology Partner API
  description: 'The commercial API behind the Rapid Technology Partner Program, which
    lets technology partners integrate Rapid imaging results into their own products
    and services. Access is granted through the partner program — RapidAI publishes
    no public developer portal, no OpenAPI/Swagger definition, and no self-service
    sign-up. The production API host observed in RapidAI''s own Rapid Web App bundle
    is a versioned (v4) AWS API Gateway surface that returns 403 "Missing Authentication
    Token" to anonymous callers. Hospital-side integration is documented as standard
    HL7, FHIR and DICOM interfaces plus custom APIs against PACS, RIS, EHR and radiology
    worklist systems.'
